<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemoplanner — Protected access</title>
<style>
:root { --paper:#f4f6f2; --ink:#173b39; --teal:#127c78; --mist:#ddece8; --coral:#c95d45; --rule:#b7c7c1; --white:#fff; }
* { box-sizing:border-box; }
body { min-width:320px; min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:var(--ink); background:var(--paper); font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.lock-card { width:min(100%,470px); border:1px solid var(--rule); background:var(--white); box-shadow:0 20px 55px rgba(23,59,57,.10); }
.card-rail { height:10px; background:var(--ink); }
.card-content { padding:42px clamp(24px,7vw,54px) 37px; }
.brand { display:flex; align-items:center; gap:10px; color:var(--ink); font-family:Georgia,"Times New Roman",serif; font-size:1.45rem; letter-spacing:-.05em; }
.brand b { font-weight:700; }.brand em { color:var(--teal); font-style:italic; font-weight:400; }
.mark { display:inline-grid; grid-template-columns:repeat(7,3px); gap:2px; place-items:center; width:31px; height:31px; border:1px solid #79aca0; border-radius:50%; transform:rotate(-20deg); }.mark i { width:2px; height:10px; border-radius:2px; background:var(--teal); }
.eyebrow { margin:40px 0 8px; color:var(--teal); font-size:.67rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
h1 { margin:0; font-family:Georgia,"Times New Roman",serif; font-size:clamp(2rem,8vw,3.05rem); letter-spacing:-.055em; line-height:.95; } h1 span { color:var(--teal); font-style:italic; font-weight:400; }
p { color:#5e7470; font-size:.88rem; line-height:1.6; }
form { margin-top:28px; } label { display:block; margin-bottom:8px; font-size:.76rem; font-weight:800; } input { width:100%; min-height:47px; padding:10px 12px; border:1px solid var(--rule); border-radius:2px; outline:none; color:var(--ink); font-size:1rem; } input:focus { border-color:var(--teal); box-shadow:0 0 0 3px rgba(18,124,120,.15); } button { width:100%; min-height:45px; margin-top:12px; border:1px solid var(--teal); border-radius:2px; background:var(--teal); color:white; cursor:pointer; font-size:.8rem; font-weight:800; } button:hover { background:#0b5a57; } .message { min-height:20px; margin:12px 0 0; color:#a53f2b; font-size:.76rem; } .foot { margin:25px 0 0; border-top:1px solid var(--rule); padding-top:18px; font-size:.71rem; }
</style>
</head>
<body>
<main class="lock-card" aria-labelledby="lock-title">
  <div class="card-rail"></div>
  <div class="card-content">
    <div class="brand" aria-label="Chemoplanner"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span><b>chemo</b><em>planner</em></span></div>
    <p class="eyebrow">Protected access</p>
    <h1 id="lock-title">Gynae-Oncology<br><span>Chemotherapy Planner</span></h1>
    <p>Enter the password to open this locally encrypted planning tool.</p>
    <form id="unlock-form">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" inputmode="numeric" autofocus required>
      <button type="submit">Unlock planner</button>
      <p id="message" class="message" role="alert" aria-live="polite"></p>
    </form>
    <p class="foot">This file is encrypted in the browser. Its contents open only after successful password decryption.</p>
  </div>
</main>
